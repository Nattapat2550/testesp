<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Control</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --card:#fff; --line:#d8d8d2; --mut:#6b6b64; --ok:#1a7f4b; --bad:#c62828; --acc:#2456d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eeeeea; --card:#222; --line:#3a3a36; --mut:#9a9a92; --ok:#4cc38a; --bad:#ff6b6b; --acc:#7da2ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font-family:system-ui,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--mut); margin:8px 0 4px; }
  input, select { width:100%; padding:10px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  button { font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); width:100%; margin-top:12px; }
  #mic { width:100%; height:96px; font-size:20px; font-weight:600; }
  #mic.on { background:var(--bad); color:#fff; border-color:var(--bad); }
  #stop { width:100%; height:72px; font-size:24px; font-weight:700; background:var(--bad); color:#fff; border-color:var(--bad); margin-top:10px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  #heard { min-height:48px; font-size:20px; }
  #state { font-size:14px; color:var(--mut); margin-top:6px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  ul { list-style:none; padding:0; margin:0; font-size:14px; }
  li { padding:6px 0; border-bottom:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; margin-top:10px; font-size:14px; }
  .row input { width:auto; }
  .link { background:none; border:none; color:var(--mut); font-size:13px; text-decoration:underline; padding:8px 0; }
</style>
</head>
<body>
<main>
  <h1>🎙️ สั่งหุ่นด้วยเสียง</h1>

  <!-- ขึ้นเฉพาะตอนยังไม่ได้ใส่ค่าในโค้ด -->
  <section class="card" id="configErr" hidden>
    <div class="bad">ยังไม่ได้ใส่ API_KEY หรือ DB_URL ในโค้ด<br>เปิดไฟล์ index.html แล้วแก้ที่บล็อก CONFIG ด้านบนของ &lt;script&gt;</div>
  </section>

  <!-- ล็อกอิน: ขึ้นครั้งแรกครั้งเดียวต่อเครื่อง หลังจากนั้นเข้าหน้าควบคุมเลย -->
  <section class="card" id="loginCard" hidden>
    <label>อีเมล</label><input id="email" type="email" autocomplete="username">
    <label>รหัสผ่าน</label><input id="pass" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">เข้าสู่ระบบ</button>
    <div id="loginMsg" class="bad" style="margin-top:8px;font-size:14px"></div>
  </section>

  <!-- หน้าควบคุม -->
  <section id="mainCard" hidden>
    <div class="card">
      <label>ภาษา</label>
      <select id="lang"><option value="th-TH">ไทย</option><option value="en-US">English</option></select>
      <button id="mic" style="margin-top:12px">แตะเพื่อพูด</button>
      <div class="row"><input type="checkbox" id="cont"><label for="cont" style="margin:0">ฟังต่อเนื่อง (เปิดไมค์ค้างไว้)</label></div>
      <div id="heard" style="margin-top:12px">—</div>
      <div id="state"></div>
    </div>

    <button id="stop">⛔ หยุด (STOP)</button>
    <button id="ping" style="width:100%;margin-top:10px">🔌 ทดสอบเชื่อมต่อ Cloud</button>
    <div id="pingMsg" style="font-size:14px;margin-top:6px"></div>

    <div class="card" style="margin-top:12px">
      <div style="font-size:13px;color:var(--mut)">ปุ่มสำรอง (ถ้าไมค์ใช้ไม่ได้)</div>
      <div class="grid" id="manual"></div>
    </div>

    <div class="card">
      <div style="font-size:13px;color:var(--mut);margin-bottom:6px">คำสั่งที่ส่งล่าสุด</div>
      <ul id="log"></ul>
    </div>
    <button class="link" id="logout">ออกจากระบบ (เปลี่ยนบัญชี)</button>
  </section>
</main>

<script>
/* =====================================================================
   CONFIG  ← แก้ตรงนี้ที่เดียว ใส่ค่าระหว่างเครื่องหมาย " "
   ห้ามใส่รหัสผ่านที่นี่ เพราะหน้านี้เป็นสาธารณะ ใครเปิดก็เห็น
   ===================================================================== */
const CONFIG = {
  API_KEY: "AIzaSyDXgAvKforpZ-46SbJi4nT3ecjcoHBhOVc",   // Web API Key จาก Firebase  เช่น "AIzaSy...."
  DB_URL:  "https://project-robot-esp32-67-default-rtdb.asia-southeast1.firebasedatabase.app/",   // Database URL เช่น "https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app"
  EMAIL:   "gtest@gmail.com",   // อีเมลของ user ใน Firebase (ใส่ไว้จะกรอกให้อัตโนมัติ)
};
/* ===================================================================== */

const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ---------- แปลงข้อความเป็นคำสั่ง ---------- */
// ลำดับสำคัญ: "stop" อยู่บนสุดเพื่อให้คำสั่งหยุดถูกจับก่อนเสมอ
const COMMANDS = [
  { action:"stop",     label:"หยุด",      words:["หยุด","stop","halt"] },
  { action:"forward",  label:"เดินหน้า",   words:["เดินหน้า","ไปข้างหน้า","ข้างหน้า","ตรงไป","forward","ahead"] },
  { action:"backward", label:"ถอยหลัง",    words:["ถอยหลัง","ถอย","backward","back","reverse"] },
  { action:"left",     label:"เลี้ยวซ้าย",  words:["เลี้ยวซ้าย","ซ้าย","left"] },
  { action:"right",    label:"เลี้ยวขวา",   words:["เลี้ยวขวา","ขวา","right"] },
  { action:"arm_up",   label:"ยกแขน",     words:["ยกแขน","แขนขึ้น","ยกขึ้น","armup","raise"] },
  { action:"arm_down", label:"ลดแขน",     words:["ลดแขน","แขนลง","ลดลง","armdown","lower"] },
  { action:"grip",     label:"หยิบ",       words:["หยิบ","จับ","คีบ","grip","grab","pick"] },
  { action:"release",  label:"ปล่อย",      words:["ปล่อย","วาง","release","drop"] },
];
//BEGIN_PARSE
function parseCommand(text) {
  const t = text.toLowerCase().replace(/\s+/g, "");   // ภาษาไทยไม่มีเว้นวรรค จึงตัดช่องว่างทิ้งเพื่อเทียบ
  for (const c of COMMANDS) {
    if (c.words.some(w => t.includes(w))) return c.action;
  }
  return null;
}
//END_PARSE

/* ---------- Firebase Auth (เก็บ refresh token ไว้ ไม่เก็บรหัสผ่าน) ---------- */
let idToken = "", tokenExp = 0;

async function signIn(email, password) {
  const r = await fetch(
    "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(CONFIG.API_KEY),
    { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email, password, returnSecureToken:true }) });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  idToken = j.idToken;
  tokenExp = Date.now() + (Number(j.expiresIn) || 3600) * 1000 - 5*60*1000;
  store.set("rt", j.refreshToken);      // ครั้งต่อไปใช้ตัวนี้ล็อกอินเอง
}

async function refreshToken() {
  const rt = store.get("rt");
  if (!rt) { const e = new Error("ยังไม่ได้ล็อกอิน"); e.fatal = true; throw e; }
  const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(CONFIG.API_KEY),
    { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(rt) });
  const j = await r.json();
  if (!r.ok) { const e = new Error((j.error && j.error.message) || ("HTTP " + r.status)); e.fatal = true; throw e; }
  idToken = j.id_token;
  tokenExp = Date.now() + (Number(j.expires_in) || 3600) * 1000 - 5*60*1000;
  if (j.refresh_token) store.set("rt", j.refresh_token);
}

async function ensureToken() {
  if (!idToken || Date.now() > tokenExp) await refreshToken();
}

async function db(method, path, body) {
  const base = CONFIG.DB_URL.trim().replace(/\/+$/, "");
  for (let attempt = 0; attempt < 2; attempt++) {
    await ensureToken();
    const r = await fetch(base + path + ".json?auth=" + encodeURIComponent(idToken),
      { method, headers:{ "Content-Type":"application/json" }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && attempt === 0) { idToken = ""; continue; }   // token เสีย -> ขอใหม่แล้วลองอีกครั้ง
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
}

/* ---------- แสดงหน้าต่าง ๆ ---------- */
function showLogin() {
  $("mainCard").hidden = true; $("loginCard").hidden = false;
  $("email").value = CONFIG.EMAIL || store.get("email");
}
function showMain() { $("loginCard").hidden = true; $("mainCard").hidden = false; }

$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  const email = $("email").value.trim();
  try {
    await signIn(email, $("pass").value);
    store.set("email", email);
    $("pass").value = "";
    showMain();
  } catch (e) { $("loginMsg").textContent = "ล็อกอินไม่สำเร็จ: " + e.message; }
};
$("logout").onclick = () => { store.del("rt"); idToken = ""; showLogin(); };

/* ---------- ส่งคำสั่ง ---------- */
let lastAction = "", lastAt = 0;
async function sendCommand(action, text, source) {
  const now = Date.now();
  if (action !== "stop" && action === lastAction && now - lastAt < 800) return;   // กันส่งซ้ำรัวๆ (stop ส่งได้เสมอ)
  lastAction = action; lastAt = now;
  const t0 = performance.now();
  try {
    await db("POST", "/commands/pending", { action, text: text || "", source, ts: Math.floor(now/1000) });
    addLog(`✅ ${action}  (${Math.round(performance.now()-t0)} ms)  ${text ? "“"+text+"”" : ""}`);
    $("state").innerHTML = `<span class="ok">ส่งแล้ว: ${action}</span>`;
  } catch (e) {
    addLog(`❌ ${action} ส่งไม่สำเร็จ: ${e.message}`);
    $("state").innerHTML = `<span class="bad">ส่งไม่สำเร็จ: ${e.message}</span>`;
    if (e.fatal) showLogin();     // refresh token ใช้ไม่ได้แล้ว -> ให้ล็อกอินใหม่
  }
}
function addLog(s) {
  const li = document.createElement("li");
  li.textContent = new Date().toLocaleTimeString("th-TH") + "  " + s;
  $("log").prepend(li);
  while ($("log").children.length > 10) $("log").lastChild.remove();
}

/* ---------- ทดสอบ Cloud: เขียนแล้วอ่านกลับ ---------- */
$("ping").onclick = async () => {
  const el = $("pingMsg");
  el.className = ""; el.textContent = "กำลังทดสอบ…";
  const t0 = performance.now(), stamp = Date.now();
  try {
    await db("PUT", "/debug/phone_ping", { ts: stamp });
    const back = await db("GET", "/debug/phone_ping");
    const ms = Math.round(performance.now() - t0);
    if (back && back.ts === stamp) { el.className = "ok"; el.textContent = `✅ เขียนและอ่านกลับจาก Firebase ได้ (${ms} ms)`; }
    else { el.className = "bad"; el.textContent = "⚠️ เขียนได้แต่อ่านกลับมาไม่ตรง"; }
  } catch (e) { el.className = "bad"; el.textContent = "❌ ติดต่อ Firebase ไม่ได้: " + e.message; }
};

/* ---------- ปุ่มสำรอง + STOP ---------- */
COMMANDS.filter(c => c.action !== "stop").forEach(c => {
  const b = document.createElement("button");
  b.textContent = c.label;
  b.onclick = () => sendCommand(c.action, "", "button");
  $("manual").appendChild(b);
});
$("stop").onclick = () => sendCommand("stop", "", "button");

/* ---------- ไมโครโฟน (Web Speech API) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, keepGoing = false, gotResult = false;

function setMic() {
  $("mic").classList.toggle("on", listening);
  $("mic").textContent = listening ? "🔴 กำลังฟัง… (แตะเพื่อหยุด)" : "แตะเพื่อพูด";
}

function startListen() {
  if (!SR) { $("state").innerHTML = '<span class="bad">เบราว์เซอร์นี้ไม่รองรับ ให้ใช้ Chrome บน Android</span>'; return; }
  rec = new SR();
  rec.lang = $("lang").value;
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 1;
  gotResult = false;
  let lastText = "", handled = false;     // กันกรณี Android ไม่ส่งสถานะ "final" มาให้
  rec.onstart = () => { $("state").textContent = "กำลังฟัง… พูดได้เลย"; };
  rec.onresult = e => {
    gotResult = true;
    let interim = "", final = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
    }
    const shown = final || interim;
    if (shown) lastText = shown.trim();
    $("heard").textContent = shown || "—";
    if (final && !handled) { handled = true; handleFinal(final.trim()); }
  };
  rec.onerror = e => {
    const msg = {
      "not-allowed": "ไม่ได้รับอนุญาตใช้ไมค์ (ตรวจสิทธิ์ของเบราว์เซอร์ และต้องเปิดผ่าน https)",
      "service-not-allowed": "ไม่ได้รับอนุญาตใช้บริการรู้จำเสียง",
      "no-speech": "ไม่ได้ยินเสียงพูด ลองพูดใกล้ไมค์และดังขึ้น",
      "audio-capture": "ไม่พบไมโครโฟน",
      "network": "รู้จำเสียงใช้ไม่ได้เพราะเน็ตมีปัญหา",
      "language-not-supported": "ไม่รองรับภาษานี้",
    }[e.error] || ("ข้อผิดพลาดของไมค์: " + e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") keepGoing = false;
    if (e.error !== "aborted") $("state").innerHTML = `<span class="bad">${msg}</span>`;
  };
  rec.onend = () => {
    listening = false; setMic();
    if (!handled && lastText) { handled = true; handleFinal(lastText); }   // จบการฟังแล้ว ใช้ข้อความล่าสุดที่ได้ยิน
    else if (!gotResult && !keepGoing && !$("state").textContent.includes("ไม่")) $("state").innerHTML = '<span class="bad">จบการฟังโดยไม่ได้ข้อความ ลองใหม่</span>';
    if (keepGoing) setTimeout(startListen, 200);
  };
  try { rec.start(); listening = true; setMic(); } catch (e) { /* กำลังเริ่มอยู่แล้ว */ }
}

function handleFinal(text) {
  const action = parseCommand(text);
  if (action) { $("state").textContent = `จับคำสั่งได้: ${action} กำลังส่ง…`; sendCommand(action, text, "voice"); }
  else {
    $("state").innerHTML = `<span class="bad">ไม่เข้าใจคำสั่ง: “${text}”</span>`;
    addLog(`❓ ได้ยินว่า “${text}” แต่ไม่ตรงกับคำสั่งใด (ยังไม่ส่ง)`);
  }
}

$("mic").onclick = () => {
  if (listening) { keepGoing = false; if (rec) rec.stop(); }
  else { keepGoing = $("cont").checked; startListen(); }
};
$("cont").onchange = () => { if (!$("cont").checked) keepGoing = false; };

/* ---------- เริ่มต้น: ถ้าเคยล็อกอินแล้ว เข้าหน้าควบคุมเลย ---------- */
(async function boot() {
  if (!CONFIG.API_KEY || !CONFIG.DB_URL) { $("configErr").hidden = false; return; }
  if (!store.get("rt")) { showLogin(); return; }
  try {
    await refreshToken();
    showMain();
  } catch (e) {
    if (e.fatal) { store.del("rt"); showLogin(); }
    else { showMain(); $("state").innerHTML = '<span class="bad">ต่อเน็ตไม่ได้ในตอนนี้ จะลองใหม่ตอนส่งคำสั่ง</span>'; }
  }
})();
</script>
</body>
</html>
