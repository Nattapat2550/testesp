[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-pickup"
version = "0.1.0"
description = "Camera-guided autonomous object pickup"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.8,<5"]

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]
yolo = ["ultralytics>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["robot_pickup*"]
