name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject config
        env:
          API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          EMAIL: ${{ secrets.FIREBASE_EMAIL }}
        run: |
          for f in docs/index.html docs/dashboard.html; do
            if [ -f "$f" ]; then
              sed -i "s|__API_KEY__|$API_KEY|g; s|__DB_URL__|$DB_URL|g; s|__EMAIL__|$EMAIL|g" "$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4